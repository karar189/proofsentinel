# ProofSentinel monitoring workflow — CRE workflow config
# Run: cre workflow simulate monitoring-workflow --target staging-settings
# From: proofsentinel/cre-workflows/ (project root)

staging-settings:
  user-workflow:
    workflow-name: "proofsentinel-monitoring-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

production-settings:
  user-workflow:
    workflow-name: "proofsentinel-monitoring-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
