# ProofSentinel CRE Monitoring Workflow
# Orchestrates: fetch reserves -> fetch liabilities -> compute ratio -> trigger safeguard if needed
# Trigger: every 5 minutes (configurable via CRE runtime)
#
# CRE executes this workflow; steps can map to:
# - evm_read for chain data
# - http_request for API/liability data
# - compute for ratio
# - evm_write to call ReserveMonitor.sol when ratio < threshold

name: proofsentinel-monitoring
description: Continuous reserve ratio monitoring and safeguard triggering

trigger:
  cron: "*/5 * * * *"   # every 5 minutes

steps:
  - name: fetch_reserves
    action: evm_read
    config:
      # Read reserve balances from configured wallets (or via backend API)
      # In practice: CRE may call backend GET /monitoring/:protocolId or read chain directly
      source: chain
      # params: chainId, wallets[], tokenAddress (optional)

  - name: fetch_liabilities
    action: http_request
    config:
      # Liability source: token totalSupply or protocol API
      # params: tokenAddress or api_url
      source: chain_or_api

  - name: compute_ratio
    action: compute
    config:
      formula: "reserves / liabilities"
      inputs:
        reserves: "{{ steps.fetch_reserves.outputs.total }}"
        liabilities: "{{ steps.fetch_liabilities.outputs.total }}"
      output: ratio

  - name: evaluate_risk
    action: compute
    config:
      # Compare ratio to protocol threshold
      condition: "ratio < criticalRatio"
      outputs:
        shouldTrigger: "{{ ratio < threshold }}"

  - name: trigger_safeguard
    condition: "{{ steps.evaluate_risk.outputs.shouldTrigger }}"
    action: evm_write
    config:
      # Call ReserveMonitor.pauseWithdrawals() or emitReserveAlert(ratio)
      contract: "ReserveMonitor"
      method: pauseWithdrawals
      # Or: method: emitReserveAlert, args: [ "{{ steps.compute_ratio.outputs.ratio }}" ]
      params: []

  - name: notify_alert
    condition: "{{ steps.evaluate_risk.outputs.shouldTrigger }}"
    action: http_request
    config:
      # POST to backend to record alert for dashboard
      method: POST
      url: "{{ env.API_BASE_URL }}/alerts"
      body:
        protocolId: "{{ env.PROTOCOL_ID }}"
        severity: critical
        message: "Reserve ratio below critical threshold"
        ratio: "{{ steps.compute_ratio.outputs.ratio }}"
